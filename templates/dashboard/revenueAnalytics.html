<div class="col-xxl-6">
    <div class="card">
        <div class="card-header">
            <h5 class="card-title">Revenue Analytics</h5>
            <div class="dropdown">
                <a href="#!" class="text-muted dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"
                    aria-label="more">Weekly</a>
                <ul class="dropdown-menu dropdown-menu-animated dropdown-menu-end">
                    <li><a class="dropdown-item" href="#!">Weekly</a></li>
                    <li><a class="dropdown-item" href="#!">Monthly</a></li>
                    <li><a class="dropdown-item" href="#!">Yearly</a></li>
                </ul>
            </div>
        </div>
        <div class="card-body">
            <div class="row g-4">
                <div class="col-md-8">
                    <div class="revenue-chart rounded-2">
                        <div class="p-5 pb-0">
                            <h5 class="mb-2">Sales Analytics</h5>
                            <p class="text-muted fs-14 mb-14">Conversion Funnel Overview by
                                Month of Year for Better Business Insights.</p>
                        </div>
                        <div id="revenueChart" 
                            data-colors='["var(--bs-primary)"]' 
                            data-series='{{ revenue_stats.chart_data|safe }}'
                            data-labels='{{ revenue_stats.chart_labels|safe }}'
                            class="apex-charts" dir="ltr"></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border rounded-3">
                        <div class="card-body d-flex align-items-start gap-4">
                            <div
                                class="avatar avatar-xs text-primary avatar-circle overflow-hidden revenue-icon gradient-primary">
                                <i data-eva="trending-up-outline" class="size-5"></i>
                            </div>
                            <div>
                                <h5 class="mb-1 fw-medium"><span data-counter="{{ revenue_stats.total_revenue|floatformat:0 }}" data-prefix="$"></span></h5>
                                <p class="text-muted fs-14 mb-0 text-truncate">Total Revenue</p>
                            </div>
                        </div>
                    </div>
                    <div class="card border rounded-3">
                        <div class="card-body d-flex align-items-start gap-4">
                            <div
                                class="avatar avatar-xs text-info avatar-circle overflow-hidden revenue-icon gradient-info">
                                <i data-eva="calendar-outline" class="size-5"></i>
                            </div>
                            <div>
                                <h5 class="mb-1 fw-medium" data-counter="{{ revenue_stats.revenue_this_month|floatformat:0 }}" data-prefix="$"></h5>
                                <p class="text-muted fs-14 mb-0 text-truncate">Revenue This Month</p>
                            </div>
                        </div>
                    </div>
                    <div class="card border rounded-3">
                        <div class="card-body d-flex align-items-start gap-4">
                            <div
                                class="avatar avatar-xs text-danger avatar-circle overflow-hidden revenue-icon gradient-danger">
                                <i data-eva="people-outline" class="size-5"></i>
                            </div>
                            <div>
                                <h5 class="mb-1 fw-medium" data-counter="{{ revenue_stats.revenue_last_month|floatformat:0 }}" data-prefix="$">
                                </h5>
                                <p class="text-muted fs-14 mb-0 text-truncate">Revenue Last Month</p>
                            </div>
                        </div>
                    </div>
                    <div class="card border rounded-3 mb-0">
                        <div class="card-body d-flex align-items-start gap-4">
                            <div
                                class="avatar avatar-xs text-secondary avatar-circle overflow-hidden revenue-icon gradient-secondary">
                                <i data-eva="shopping-cart-outline" class="size-5"></i>
                            </div>
                            <div>
                                <h5 class="mb-1 fw-medium"><span data-counter="{{ revenue_stats.avg_deal_size|floatformat:0 }}" data-prefix="$"></span></h5>
                                <p class="text-muted fs-14 mb-0 text-truncate">Avg Deal Size</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
